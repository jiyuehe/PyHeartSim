<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Node Selection Tool</title>
    <link rel="stylesheet" href="ui_select_nodes.css">
</head>
<body>
    <div id="loading">Loading geometry...</div>

    <div id="toolbar" style="display:none;">
        <label>Flag:</label>
        <select id="flag-value">
            <option value="0">0 (None)</option>
            <option value="1" selected>1 (S1)</option>
            <option value="2">2 (S2)</option>
            <option value="3">3</option>
            <option value="4">4</option>
        </select>
        <div class="separator"></div>
        <label>Selection:</label>
        <select id="selection-mode">
            <option value="region">Region</option>
            <option value="line" selected>Line</option>
        </select>
        <div class="separator"></div>
        <label>Depth&nbsp;%:</label>
        <input type="range" id="depth-threshold" min="1" max="100" value="40" style="width:80px;">
        <span id="depth-value">40%</span>
        <div class="separator"></div>
        <div id="line-width-group" style="display:flex; gap:10px; align-items:center; flex-wrap:nowrap;">
            <label>Line&nbsp;width:</label>
            <input type="range" id="line-width" min="2" max="60" value="5" style="width:80px;">
            <span id="line-width-value">5px</span>
            <div class="separator"></div>
        </div>
        <button class="btn-undo" id="btn-undo" title="Undo last selection">Undo</button>
        <button class="btn-clear" id="btn-clear" title="Clear all flags">Clear All</button>
        <button class="btn-save" id="btn-save" title="Save flags to file">Save</button>
        <div class="separator"></div>
    </div>

    <div id="mode-indicator" class="mode-rotate" style="display:none;">
        Rotate Mode &mdash; Hold Shift to Select
    </div>

    <div id="instructions" style="display:none;">
        Rotate: Left drag &nbsp;|&nbsp; Pan: Right drag &nbsp;|&nbsp; Zoom: Scroll &nbsp;|&nbsp; Region: Shift + Drag &nbsp;|&nbsp; Line: choose Line mode + Shift + Drag
    </div>

    <div id="output-panel" style="display:none;">
        <div id="output-panel-header" onclick="toggleOutputPanel()">
            <span>Node Indices by Flag</span>
            <span id="output-panel-toggle">&#9660;</span>
        </div>
        <div id="output-panel-body"></div>
    </div>

    <div id="status"></div>
    <div id="canvas-container"></div>
    <canvas id="lasso-canvas"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ---- state ----
        let nodePositions = null; // Float32Array (centered for display)
        let faceIndices = null;   // Uint16Array or Uint32Array triangle indices
        let nodeFlags = null;     // Int32Array
        let nodeCount = 0;
        let faceCount = 0;
        let undoStack = [];
        const MAX_UNDO = 20;
        let LINE_SELECTION_MAX_DISTANCE_PIXELS = parseInt(document.getElementById('line-width').value);
        let isSelecting = false;
        let isShiftPressed = false;
        let selectionPoints = [];
        let selectionMode = 'line';
        let meshAdjacency = null;

        // ---- color map for displayed node flags ----
        const COLOR_MAP = [
            new THREE.Color(1.0, 1.0, 1.0),  // 0: white
            new THREE.Color(1.0, 0.0, 0.0),  // 1: red
            new THREE.Color(1.0, 0.0, 1.0),  // 2: magenta
            new THREE.Color(0.0, 0.0, 0.0),  // 3: black
            new THREE.Color(0.0, 1.0, 0.0),  // 4: green
        ];

        function getFlagColor(flag) {
            if (flag === 0) return COLOR_MAP[0];
            if (flag === 1) return COLOR_MAP[1];
            if (flag === 2) return COLOR_MAP[2];
            if (flag === 3) return COLOR_MAP[3];
            return COLOR_MAP[4];
        }

        // ---- Three.js setup ----
        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0xffffff);
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            60, window.innerWidth / window.innerHeight, 0.01, 1000
        );

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;

        // lasso overlay
        const lassoCanvas = document.getElementById('lasso-canvas');
        const lassoCtx = lassoCanvas.getContext('2d');
        lassoCanvas.width = window.innerWidth;
        lassoCanvas.height = window.innerHeight;

        let geometry, material, mesh, colorsAttribute;

        // ---- fetch data and initialize ----
        async function init() {
            const resp = await fetch('/api/nodes');
            const data = await resp.json();

            nodeCount = data.count;
            faceCount = data.face_count;
            nodePositions = new Float32Array(data.positions);
            const useUint32 = nodeCount > 65535;
            faceIndices = useUint32
                ? new Uint32Array(data.faces)
                : new Uint16Array(data.faces);
            nodeFlags = new Int32Array(data.flags);
            buildMeshAdjacency();

            // center geometry at origin for proper rotation
            let cx = 0, cy = 0, cz = 0;
            for (let i = 0; i < nodeCount; i++) {
                cx += nodePositions[i * 3];
                cy += nodePositions[i * 3 + 1];
                cz += nodePositions[i * 3 + 2];
            }
            cx /= nodeCount; cy /= nodeCount; cz /= nodeCount;

            for (let i = 0; i < nodeCount; i++) {
                nodePositions[i * 3]     -= cx;
                nodePositions[i * 3 + 1] -= cy;
                nodePositions[i * 3 + 2] -= cz;
            }

            // bounding sphere radius for camera placement
            let maxR = 0;
            for (let i = 0; i < nodeCount; i++) {
                const x = nodePositions[i * 3];
                const y = nodePositions[i * 3 + 1];
                const z = nodePositions[i * 3 + 2];
                const r = Math.sqrt(x * x + y * y + z * z);
                if (r > maxR) maxR = r;
            }

            // build indexed triangular mesh
            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(nodePositions, 3));
            geometry.setIndex(new THREE.BufferAttribute(faceIndices, 1));
            geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(nodeCount * 3).fill(1), 3));

            geometry.computeVertexNormals();

            material = new THREE.MeshBasicMaterial({
                vertexColors: true,
                color: 0xffffff,
                side: THREE.DoubleSide,
                polygonOffset: true,
                polygonOffsetFactor: 1.0,
                polygonOffsetUnits: 1.0,
                transparent: true,
                opacity: 1,
                depthWrite: true,
                depthTest: true,
            });

            mesh = new THREE.Mesh(geometry, material);
            mesh.renderOrder = 1;
            scene.add(mesh);

            updateColors();

            const wireMaterial = new THREE.MeshBasicMaterial({
                color: 0x666666,
                wireframe: true,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 1,
            });
            const wireMesh = new THREE.Mesh(geometry, wireMaterial);
            wireMesh.renderOrder = 2;
            scene.add(wireMesh);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
            directionalLight.position.set(1, 1, 1);
            scene.add(ambientLight);
            scene.add(directionalLight);

            // camera
            camera.position.set(0, 0, maxR * 2.5);
            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);
            controls.update();

            // show UI
            document.getElementById('loading').style.display = 'none';
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('mode-indicator').style.display = 'block';
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('output-panel').style.display = 'flex';
            updateNodeCount();
            animate();
        }

        function updateColors() {
            if (!geometry || !geometry.attributes.color) return;

            const colorAttr = geometry.attributes.color.array;
            for (let i = 0; i < nodeCount; i++) {
                const color = getFlagColor(nodeFlags[i]);
                const idx = i * 3;
                colorAttr[idx] = color.r;
                colorAttr[idx + 1] = color.g;
                colorAttr[idx + 2] = color.b;
            }
            geometry.attributes.color.needsUpdate = true;
        }

        function updateNodeCount() {
            let flagged = 0;
            for (let i = 0; i < nodeCount; i++) if (nodeFlags[i] > 0) flagged++;
            updateOutputPanel();
        }

        // ---- output panel ----
        const FLAG_LABELS = { 1: 'Flag 1 (S1)', 2: 'Flag 2 (S2)', 3: 'Flag 3', 4: 'Flag 4' };
        let outputPanelCollapsed = false;
        const flagSectionCollapsed = {};

        function toggleFlagSection(k) {
            flagSectionCollapsed[k] = !flagSectionCollapsed[k];
            const body = document.getElementById('flag-body-' + k);
            const arrow = document.getElementById('flag-arrow-' + k);
            if (body) body.style.display = flagSectionCollapsed[k] ? 'none' : 'block';
            if (arrow) arrow.innerHTML = flagSectionCollapsed[k] ? '&#9654;' : '&#9660;';
        }
        window.toggleFlagSection = toggleFlagSection;

        function toggleOutputPanel() {
            outputPanelCollapsed = !outputPanelCollapsed;
            document.getElementById('output-panel-body').style.display =
                outputPanelCollapsed ? 'none' : 'block';
            document.getElementById('output-panel-toggle').innerHTML =
                outputPanelCollapsed ? '&#9654;' : '&#9660;';
        }
        window.toggleOutputPanel = toggleOutputPanel;

        function updateOutputPanel() {
            const body = document.getElementById('output-panel-body');
            const groups = {};
            for (let i = 0; i < nodeCount; i++) {
                const f = nodeFlags[i];
                if (f > 0) {
                    if (!groups[f]) groups[f] = [];
                    groups[f].push(i);
                }
            }

            let html = '';
            const keys = Object.keys(FLAG_LABELS).map(Number);
            for (const k of keys) {
                const label = FLAG_LABELS[k] || ('Flag ' + k);
                const indices = groups[k];
                const isCollapsed = flagSectionCollapsed[k];
                html += '<div class="flag-section">';
                html += '<div class="flag-section-title" onclick="toggleFlagSection(' + k + ')">' +
                    '<span id="flag-arrow-' + k + '">' + (isCollapsed ? '&#9654;' : '&#9660;') + '</span> ' + label + '</div>';
                html += '<div class="flag-section-content' + ((!indices || indices.length === 0) ? ' empty' : '') + '" id="flag-body-' + k + '" style="display:' + (isCollapsed ? 'none' : 'block') + '">';
                html += (indices && indices.length > 0) ? indices.join(', ') : 'none';
                html += '</div>';
                html += '</div>';
            }

            // any flags beyond 4
            for (const k of Object.keys(groups).map(Number).sort()) {
                if (k >= 1 && k <= 4) continue;
                const indices = groups[k];
                const isCollapsedK = flagSectionCollapsed[k];
                html += '<div class="flag-section">';
                html += '<div class="flag-section-title" onclick="toggleFlagSection(' + k + ')">' +
                    '<span id="flag-arrow-' + k + '">' + (isCollapsedK ? '&#9654;' : '&#9660;') + '</span> Flag ' + k + '</div>';
                html += '<div class="flag-section-content" id="flag-body-' + k + '" style="display:' + (isCollapsedK ? 'none' : 'block') + '">' + indices.join(', ') + '</div>';
                html += '</div>';
            }

            body.innerHTML = html;
        }

        function pushUndo() {
            undoStack.push(new Int32Array(nodeFlags));
            if (undoStack.length > MAX_UNDO) undoStack.shift();
        }

        function showStatus(msg, duration) {
            duration = duration || 2000;
            const el = document.getElementById('status');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(function() { el.style.display = 'none'; }, duration);
        }

        function updateModeIndicator() {
            const ind = document.getElementById('mode-indicator');
            if (selectionMode === 'line' && isSelecting) {
                ind.textContent = 'Line Select Mode \u2014 Shift + Drag to Select';
                ind.className = 'mode-select';
                return;
            }
            if (selectionMode === 'line' && isShiftPressed) {
                ind.textContent = 'Line Select Ready \u2014 Shift + Drag to Select';
                ind.className = 'mode-select';
                return;
            }
            if (isSelecting) {
                ind.textContent = 'Select Mode \u2014 Shift + Drag to Select';
                ind.className = 'mode-select';
                return;
            }
            ind.textContent = 'Rotate Mode \u2014 Hold Shift to Select';
            ind.className = 'mode-rotate';
        }

        // ---- selection drawing ----
        function drawSelectionOverlay() {
            lassoCtx.clearRect(0, 0, lassoCanvas.width, lassoCanvas.height);
            if (selectionPoints.length < 2) return;
            lassoCtx.beginPath();
            lassoCtx.moveTo(selectionPoints[0].x, selectionPoints[0].y);
            for (let i = 1; i < selectionPoints.length; i++) {
                lassoCtx.lineTo(selectionPoints[i].x, selectionPoints[i].y);
            }
            lassoCtx.strokeStyle = 'rgba(255, 255, 0, 0.9)';
            lassoCtx.lineWidth = 2;
            lassoCtx.stroke();

            if (selectionMode === 'region' && selectionPoints.length >= 3) {
                lassoCtx.closePath();
                lassoCtx.fillStyle = 'rgba(255, 255, 0, 0.1)';
                lassoCtx.fill();
            }
        }

        function clearSelectionOverlay() {
            lassoCtx.clearRect(0, 0, lassoCanvas.width, lassoCanvas.height);
            selectionPoints = [];
        }

        // ---- point-in-polygon (ray casting algorithm) ----
        function pointInPolygon(px, py, polygon) {
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i].x, yi = polygon[i].y;
                const xj = polygon[j].x, yj = polygon[j].y;
                if ((yi > py) !== (yj > py) &&
                    px < (xj - xi) * (py - yi) / (yj - yi) + xi) {
                    inside = !inside;
                }
            }
            return inside;
        }

        function buildMeshAdjacency() {
            const neighbors = Array.from({ length: nodeCount }, () => new Set());

            for (let i = 0; i < faceIndices.length; i += 3) {
                const a = faceIndices[i];
                const b = faceIndices[i + 1];
                const c = faceIndices[i + 2];

                neighbors[a].add(b); neighbors[a].add(c);
                neighbors[b].add(a); neighbors[b].add(c);
                neighbors[c].add(a); neighbors[c].add(b);
            }

            meshAdjacency = neighbors.map((s) => Array.from(s));
        }

        function samplePolyline(points, stepPixels) {
            if (points.length === 0) return [];

            const samples = [points[0]];
            for (let i = 1; i < points.length; i++) {
                const a = points[i - 1];
                const b = points[i];
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 1e-6) continue;

                const steps = Math.max(1, Math.ceil(distance / stepPixels));
                for (let s = 1; s <= steps; s++) {
                    const t = s / steps;
                    samples.push({
                        x: a.x + dx * t,
                        y: a.y + dy * t,
                    });
                }
            }

            return samples;
        }

        function simplifyStrokePoints(points, minSpacingPixels) {
            if (points.length === 0) return [];

            const simplified = [points[0]];
            let last = points[0];

            for (let i = 1; i < points.length; i++) {
                const p = points[i];
                const dx = p.x - last.x;
                const dy = p.y - last.y;
                if (dx * dx + dy * dy >= minSpacingPixels * minSpacingPixels) {
                    simplified.push(p);
                    last = p;
                }
            }

            const tail = points[points.length - 1];
            const end = simplified[simplified.length - 1];
            if (tail.x !== end.x || tail.y !== end.y) {
                simplified.push(tail);
            }

            return simplified;
        }

        function nearestVertexIndexAtPoint(px, py, screenX, screenY, depths, maxDistancePixels = LINE_SELECTION_MAX_DISTANCE_PIXELS) {
            let nearestIndex = -1;
            let nearestDistSquared = Infinity;
            let nearestDepth = Infinity;
            const maxDistanceSquared = maxDistancePixels * maxDistancePixels;

            for (let i = 0; i < nodeCount; i++) {
                const dx = screenX[i] - px;
                const dy = screenY[i] - py;
                const distSquared = dx * dx + dy * dy;

                if (distSquared > maxDistanceSquared) continue;

                if (distSquared + 1e-6 < nearestDistSquared) {
                    nearestDistSquared = distSquared;
                    nearestDepth = depths[i];
                    nearestIndex = i;
                } else if (Math.abs(distSquared - nearestDistSquared) <= 1e-6 && depths[i] < nearestDepth) {
                    nearestDepth = depths[i];
                    nearestIndex = i;
                }
            }

            return nearestIndex;
        }

        function buildLineAnchorIndices(sampledPoints, screenX, screenY, depths, minAnchorSpacingPixels) {
            const anchors = [];
            let lastAnchor = -1;
            let lastAnchorX = 0;
            let lastAnchorY = 0;
            const minSpacingSquared = minAnchorSpacingPixels * minAnchorSpacingPixels;

            for (const p of sampledPoints) {
                const nearestIndex = nearestVertexIndexAtPoint(
                    p.x, p.y, screenX, screenY, depths, LINE_SELECTION_MAX_DISTANCE_PIXELS
                );
                if (nearestIndex < 0 || nearestIndex === lastAnchor) continue;

                const x = screenX[nearestIndex];
                const y = screenY[nearestIndex];
                if (anchors.length > 0) {
                    const dx = x - lastAnchorX;
                    const dy = y - lastAnchorY;
                    if (dx * dx + dy * dy < minSpacingSquared) {
                        continue;
                    }
                }

                anchors.push(nearestIndex);
                lastAnchor = nearestIndex;
                lastAnchorX = x;
                lastAnchorY = y;
            }

            // Keep line selection as an open polyline: do not close end back to start.
            if (anchors.length > 2 && anchors[anchors.length - 1] === anchors[0]) {
                anchors.pop();
            }

            return anchors;
        }

        function shortestPathOnMesh(start, end) {
            if (start === end) return [start];
            if (!meshAdjacency) return [start, end];

            const startNeighbors = meshAdjacency[start] || [];
            for (const n of startNeighbors) {
                if (n === end) return [start, end];
            }

            const visited = new Uint8Array(nodeCount);
            const previous = new Int32Array(nodeCount);
            previous.fill(-1);

            const queue = new Int32Array(nodeCount);
            let head = 0;
            let tail = 0;

            queue[tail++] = start;
            visited[start] = 1;

            while (head < tail && !visited[end]) {
                const current = queue[head++];
                const neighbors = meshAdjacency[current] || [];

                for (const next of neighbors) {
                    if (visited[next]) continue;
                    visited[next] = 1;
                    previous[next] = current;
                    queue[tail++] = next;
                    if (next === end) break;
                }
            }

            if (!visited[end]) return [start, end];

            const reversedPath = [];
            let node = end;
            while (node !== -1) {
                reversedPath.push(node);
                if (node === start) break;
                node = previous[node];
            }

            reversedPath.reverse();
            return reversedPath;
        }

        function projectNodesToScreen() {
            const w = renderer.domElement.clientWidth;
            const h = renderer.domElement.clientHeight;
            const screenX = new Float32Array(nodeCount);
            const screenY = new Float32Array(nodeCount);
            const depths = new Float32Array(nodeCount);
            const vec = new THREE.Vector3();

            for (let i = 0; i < nodeCount; i++) {
                vec.set(nodePositions[i * 3], nodePositions[i * 3 + 1], nodePositions[i * 3 + 2]);
                vec.project(camera);
                screenX[i] = (vec.x + 1) / 2 * w;
                screenY[i] = (-vec.y + 1) / 2 * h;
                depths[i] = vec.z;
            }

            return { screenX, screenY, depths };
        }

        function applyDepthFilter(candidateIndices, depths, depthPercent) {
            if (candidateIndices.length === 0) return [];

            let minDepth = Infinity;
            let maxDepth = -Infinity;
            for (const i of candidateIndices) {
                if (depths[i] < minDepth) minDepth = depths[i];
                if (depths[i] > maxDepth) maxDepth = depths[i];
            }

            const depthRange = maxDepth - minDepth;
            const threshold = depthRange * (depthPercent / 100);
            return candidateIndices.filter((i) => depths[i] - minDepth <= threshold + 1e-6);
        }

        // ---- perform region selection on release ----
        function performRegionSelection() {
            if (selectionPoints.length < 3) return;

            const flagValue = parseInt(document.getElementById('flag-value').value);
            const depthPercent = parseInt(document.getElementById('depth-threshold').value);
            const { screenX, screenY, depths } = projectNodesToScreen();

            // lasso bounding box for quick rejection
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (const p of selectionPoints) {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            }

            // find points inside lasso
            const insideIndices = [];
            for (let i = 0; i < nodeCount; i++) {
                if (screenX[i] < minX || screenX[i] > maxX ||
                    screenY[i] < minY || screenY[i] > maxY) continue;
                if (pointInPolygon(screenX[i], screenY[i], selectionPoints)) {
                    insideIndices.push(i);
                }
            }

            if (insideIndices.length === 0) return;

            const selectedIndices = applyDepthFilter(insideIndices, depths, depthPercent);
            if (selectedIndices.length === 0) return;

            pushUndo();

            for (const i of selectedIndices) {
                nodeFlags[i] = flagValue;
            }

            updateColors();
            updateNodeCount();
            showStatus('Selected ' + selectedIndices.length + ' nodes with flag ' + flagValue);
        }

        // ---- perform line selection on release ----
        function performLineSelection() {
            if (selectionPoints.length < 2) return;

            const flagValue = parseInt(document.getElementById('flag-value').value);
            const depthPercent = parseInt(document.getElementById('depth-threshold').value);
            const { screenX, screenY, depths } = projectNodesToScreen();

            // Sample the stroke densely so every part of the drawn path is covered.
            const simplifiedStroke = simplifyStrokePoints(selectionPoints, 4);
            const sampledPoints = samplePolyline(simplifiedStroke, 4);

            // Collect every mesh node within the snap radius of any stroke sample point.
            // This avoids BFS path-finding on mesh topology which causes chaotic results
            // when two anchor nodes are topologically far apart despite being close on screen.
            const snapRadiusSq = LINE_SELECTION_MAX_DISTANCE_PIXELS * LINE_SELECTION_MAX_DISTANCE_PIXELS;
            const selectedSet = new Set();

            for (const p of sampledPoints) {
                for (let i = 0; i < nodeCount; i++) {
                    const dx = screenX[i] - p.x;
                    const dy = screenY[i] - p.y;
                    if (dx * dx + dy * dy <= snapRadiusSq) {
                        selectedSet.add(i);
                    }
                }
            }

            if (selectedSet.size === 0) return;

            // Apply depth filter to avoid selecting back-face nodes.
            const candidateIndices = Array.from(selectedSet);
            const finalIndices = applyDepthFilter(candidateIndices, depths, depthPercent);
            if (finalIndices.length === 0) return;

            pushUndo();

            for (const i of finalIndices) {
                nodeFlags[i] = flagValue;
            }

            updateColors();
            updateNodeCount();
            showStatus('Selected ' + finalIndices.length + ' nodes along line with flag ' + flagValue);
        }

        function performSelection() {
            if (selectionMode === 'line') {
                performLineSelection();
                return;
            }
            performRegionSelection();
        }

        // ---- event handlers ----
        const canvas = renderer.domElement;

        document.getElementById('selection-mode').addEventListener('change', function(e) {
            selectionMode = e.target.value;
            updateModeIndicator();
        });

        // shift key state for mode indicator
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Shift') {
                isShiftPressed = true;
                updateModeIndicator();
            }
        });

        document.addEventListener('keyup', function(e) {
            if (e.key === 'Shift') {
                isShiftPressed = false;
                updateModeIndicator();
            }
        });

        canvas.addEventListener('mousedown', function(e) {
            const shouldStartRegionSelection = selectionMode === 'region' && e.button === 0 && e.shiftKey;
            const shouldStartLineSelection = selectionMode === 'line' && e.button === 0 && e.shiftKey;

            if (shouldStartRegionSelection || shouldStartLineSelection) {
                e.preventDefault();
                isSelecting = true;
                controls.enabled = false;
                canvas.style.cursor = 'crosshair';
                selectionPoints = [{ x: e.clientX, y: e.clientY }];
                updateModeIndicator();
            }
        });

        canvas.addEventListener('mousemove', function(e) {
            if (isSelecting) {
                selectionPoints.push({ x: e.clientX, y: e.clientY });
                drawSelectionOverlay();
            }
        });

        canvas.addEventListener('mouseup', function(e) {
            if (isSelecting && e.button === 0) {
                isSelecting = false;
                controls.enabled = true;
                canvas.style.cursor = 'default';

                if (selectionPoints.length >= 2) {
                    performSelection();
                }
                clearSelectionOverlay();

                updateModeIndicator();
            }
        });

        // prevent context menu on right-click (right-drag is used for pan)
        canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        // ---- UI buttons ----
        document.getElementById('btn-save').addEventListener('click', async function() {
            const resp = await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ flags: Array.from(nodeFlags) })
            });
            const result = await resp.json();
            showStatus('Saved! S1: ' + result.s1_count + ' nodes, S2: ' + result.s2_count + ' nodes', 3000);
        });

        document.getElementById('btn-clear').addEventListener('click', function() {
            pushUndo();
            nodeFlags.fill(0);
            updateColors();
            updateNodeCount();
            showStatus('Cleared all flags');
        });

        document.getElementById('btn-undo').addEventListener('click', function() {
            if (undoStack.length === 0) {
                showStatus('Nothing to undo');
                return;
            }
            nodeFlags = undoStack.pop();
            updateColors();
            updateNodeCount();
            showStatus('Undone');
        });

        document.getElementById('depth-threshold').addEventListener('input', function(e) {
            document.getElementById('depth-value').textContent = e.target.value + '%';
        });

        document.getElementById('line-width').addEventListener('input', function(e) {
            LINE_SELECTION_MAX_DISTANCE_PIXELS = parseInt(e.target.value);
            document.getElementById('line-width-value').textContent = e.target.value + 'px';
        });

        // ---- window resize ----
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            lassoCanvas.width = window.innerWidth;
            lassoCanvas.height = window.innerHeight;
        });

        // ---- animation loop ----
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // ---- start ----
        updateModeIndicator();
        init();
    </script>
</body>
</html>
